[include mainsail.cfg]
[include Macros/stealthburner_leds.cfg]
[include Macros/printStart.cfg]
#[include EBB36.cfg]
[include Macros/bedfans.cfg]
[include nitehawk-36.cfg]
[include shaketune.cfg]
[include motors.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_17001C001650344D30353320-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 300  
max_accel: 6200
max_z_velocity: 15       
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   Beacon
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_A36FFC555154364134202020FF143C24-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: 22 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2

[safe_z_home]
home_xy_position: 150, 150 # update for your machine
z_hop: 3

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[bed_mesh]
speed: 600
horizontal_move_z: 5
mesh_min: 25,25
mesh_max: 275,265
fade_start: 0.6
fade_end: 10.0
probe_count: 25,25
algorithm: bicubic

#####################################################################
#   Fan Control
#####################################################################

##  Controller fan - FAN2
[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
fan_speed: 1.0

#####################################################################
#   LED Control
#####################################################################

[output_pin caselight]
## Chamber Lighting - CNC_FAN5
pin: PD15
pwm:true
shutdown_value: 0
value:1.0
cycle_time: 0.01

#####################################################################
#   Additional Sensors
#####################################################################

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor chamber]
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF4
min_temp: 10
max_temp: 100


# [thermistor CMFB103F3950FANT]
# temperature1: 0.0
# resistance1: 32116.0
# temperature2: 40.0
# resistance2: 5309.0
# temperature3: 80.0
# resistance3: 1228.0

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 1800

[exclude_object]

[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
   25,10
   25,245
   275,245
   275,10

speed: 500
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.01
max_adjust: 10

#####################################################################
#   Input Shaper
#####################################################################
[input_shaper]
shaper_freq_x: 67.7 #max acel 8600
shaper_freq_y: 53.8 #max acel 5300
shaper_type:ei


