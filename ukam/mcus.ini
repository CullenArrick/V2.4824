# This file stores the flash_commands for each mcus
# Previous version KCONFIG_CONFIG was needed now it is automaticly added when make flash is called
# version : 0.2
# tested/supported flash methods :
#  - make flash
#  - sdcard_flash
#  - flashtool.py
#  - mount/cp/umount (for rp2040)
#  - external scripts ...

[Octopus]
klipper_section: mcu 
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-Klipper_stm32f446xx_17001C001650344D30353320-if00
action_command: python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32f446xx_17001C001650344D30353320-if00

[NH36]
klipper_section: mcu nhk
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-Klipper_rp2040_4E363334320E1C4A-if00
action_command: python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_rp2040_4E363334320E1C4A-if00

[beacon]
is_klipper_fw: false
quiet_command: sudo systemctl stop klipper
action_command: git -C ~/beacon_klipper pull
action_command: ~/beacon_klipper/update_firmware.py update all

