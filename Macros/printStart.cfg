[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X150 Y150 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32


[gcode_macro PRINT_START]
gcode:
  # Fetch target temperatures from slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0

  # Initial home and move to center
  STATUS_HOMING
  G28
  G90

  # Heat bed completely & nozzle to 150C safe probing temp
  SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}C"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M190 S{target_bed}

  SET_DISPLAY_TEXT MSG="Heating Hotend: 150C"
  M109 S150

  # Step 1: Calibrate Beacon Proximity Model
  SET_DISPLAY_TEXT MSG="Calibrating Beacon"
  STATUS_HOMING
  G28 Z METHOD=CONTACT CALIBRATE=1

  # Step 2: Level Gantry
  SET_DISPLAY_TEXT MSG="QGL"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL

  # Step 3: Run Bed Mesh using calibrated proximity
  SET_DISPLAY_TEXT MSG="Bed Mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Step 4: Final Contact Touch at 150C before final heat-up
  SET_DISPLAY_TEXT MSG="Final Z Contact Touch"
  G28 Z METHOD=CONTACT CALIBRATE=0
  SET_GCODE_OFFSET Z_ADJUST=0.13
  
  # Step 5: Heat nozzle to final print temperature at Z15 (off the bed)
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}C"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M109 S{target_extruder}

  # Purge line and begin print
  STATUS_PRINTING
  G0 X{x_wait - 50} Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90
   

[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 25, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    SET_FAN_SPEED FAN=BedFans SPEED=0
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END