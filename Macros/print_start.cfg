[gcode_macro PRINT_START]
gcode:
  # Fetch target temperatures from slicer
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0

  # Initial home and move to center
  STATUS_HOMING
  G28
  G90

  # Heat bed completely & nozzle to 150C safe probing temp
  SET_DISPLAY_TEXT MSG="Heating Bed: {target_bed}C"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M190 S{target_bed}

  SET_DISPLAY_TEXT MSG="Heating Hotend: 150C"
  M109 S150

  # Step 1: Calibrate Beacon Proximity Model
  SET_DISPLAY_TEXT MSG="Calibrating Beacon"
  STATUS_HOMING
  G28 Z METHOD=CONTACT CALIBRATE=1

  # Step 2: Level Gantry
  SET_DISPLAY_TEXT MSG="QGL"
  STATUS_LEVELING
  QUAD_GANTRY_LEVEL

  # Step 3: Run Bed Mesh using calibrated proximity
  SET_DISPLAY_TEXT MSG="Bed Mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Step 4: Final Contact Touch at 150C before final heat-up
  SET_DISPLAY_TEXT MSG="Final Z Contact Touch"
  G28 Z METHOD=CONTACT CALIBRATE=0
  SET_GCODE_OFFSET Z_ADJUST=0.13
  
  # Step 5: Heat nozzle to final print temperature at Z15 (off the bed)
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}C"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M109 S{target_extruder}

  # Purge line and begin print
  STATUS_PRINTING
  G0 X{x_wait - 50} Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90